id: health-agent-wiki
name: Health Education Agent Wiki
version: 0.1.0
language: zh-CN
domain: health_education
risk_level: high
freshness_requirement: high
description: "健康科普与报告解释辅助知识库，不诊断、不替代医生。"
entrypoints:
  - README.md
  - AGENTS.md
  - rules/core-rules.md
required_directories:
  - concepts
  - rules
  - workflows
  - cases
  - tools
  - prompts
  - evals
  - sources
trigger_keywords: ["健康", "体检", "营养", "运动", "症状", "药品"]
update_policy:
  stable_knowledge: update when better rules or examples are found
  current_facts: mark needs-source-update unless verified from authoritative sources
safety:
  require_human_confirmation_for_high_risk: true
  no_secret_storage: true
  no_autonomous_high_risk_execution: true
