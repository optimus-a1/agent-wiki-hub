id: content-agent-wiki
name: Content Agent Wiki
version: 0.1.0
language: zh-CN
domain: content_operations
risk_level: low
freshness_requirement: medium
description: "研究简报、日报、文章、短帖、长帖、标题和发布检查知识库。"
entrypoints:
  - README.md
  - AGENTS.md
  - rules/core-rules.md
required_directories:
  - concepts
  - rules
  - workflows
  - cases
  - tools
  - prompts
  - evals
  - sources
trigger_keywords: ["内容", "写作", "日报", "公众号", "帖子", "标题", "摘要", "发布"]
update_policy:
