    question: "How should an agent use Factuality Checklist while respecting No Invented Quotes?"
    expected_wiki: content-agent-wiki
    expected_concepts:
      - "Factuality Checklist"
      - "No Invented Quotes"
    risk_level: low
    source_update_required: false
    human_gate_required: false
    forbidden_answer_patterns:
