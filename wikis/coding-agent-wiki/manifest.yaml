id: coding-agent-wiki
name: Coding Agent Wiki
version: 0.1.0
language: zh-CN
domain: software_engineering
risk_level: medium
freshness_requirement: medium
description: "编程、Debug、测试、部署、代码审查和 Codex 协作知识库。"
entrypoints:
  - README.md
  - AGENTS.md
  - rules/core-rules.md
required_directories:
  - concepts
  - rules
  - workflows
  - cases
  - tools
  - prompts
  - evals
  - sources
trigger_keywords: ["代码", "编程", "debug", "测试", "部署", "API", "数据库", "Codex", "GitHub"]
update_policy:
  stable_knowledge: update when better rules or examples are found
  current_facts: mark needs-source-update unless verified from authoritative sources
safety:
  require_human_confirmation_for_high_risk: true
  no_secret_storage: true
  no_autonomous_high_risk_execution: true
